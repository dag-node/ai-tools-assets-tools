# SPDX-License-Identifier: MIT
# The checks every publisher repository runs, as a reusable workflow a publisher calls at a pinned tag and as this
# repository's own, on every pull request and every push to develop and main.
#
#   jobs:
#     ai-tools-assets:
#       uses: dag-node/ai-tools-assets-tools/.github/workflows/validate.yml@v1
#       with:
#         license-exceptions: ''          # space-separated GLOB=ID pairs check-licenses accepts
#         enforce-signoff: false          # true once the repository requires a DCO sign-off on every commit
#         tools-repository: ''            # a fork of this repository the tools are checked out from, as <owner>/<repo>
#
# The status check a ruleset requires on main is `validate` in this repository and `<caller job> / validate` in
# a caller. The calling job is named for the calling repository, as in the example for dag-node/ai-tools-assets, whose
# check is `ai-tools-assets / validate`, the exact context that repository's ruleset requires. A caller also lists
# `<caller job> / tests (python ${{ matrix.python }})` as skipped: the suite runs in this repository alone, and
# a skipped job's name keeps its matrix expression.
#
# The tools run from a checkout of the repository and commit that define this
# workflow file -- job.workflow_repository, job.workflow_sha and job.workflow_file_path, which name the reusable
# workflow's own file in a called job where the github.* context names the caller's -- so a caller pinned at a tag runs
# that tag's tools and a caller's own tree is never the tools. The resolve step refuses a repository other than
# dag-node/ai-tools-assets-tools unless the caller names its fork in tools-repository, and a file path other than
# .github/workflows/validate.yml, so a copy of this file in another repository does not become the tools source. The
# job.* fields are absent on GitHub Enterprise Server, where the step stops before the checkout: a publisher on GHES
# runs the tools from a local pin instead. Over a repository with no publisher.conf (this one) the set checks are
# skipped and the tree checks run. The sign-off check reads a pull request's own range, base.sha..head.sha, and reports
# without failing the job until enforce-signoff is true.
name: validate

on:
  workflow_call:
    inputs:
      license-exceptions:
        description: space-separated GLOB=ID pairs check-licenses accepts, for a tree carrying another licence in one directory; REUSE's glob grammar, so `dir/**` covers a directory
        type: string
        required: false
        default: ''
      enforce-signoff:
        description: fail the job when a commit of the pull request carries no author-matching Signed-off-by
        type: boolean
        required: false
        default: false
      tools-repository:
        description: the fork of dag-node/ai-tools-assets-tools this workflow is called from, as <owner>/<repo>; the tools are checked out from it
        type: string
        required: false
        default: ''
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    env:
      TOOLS: ${{ github.workspace }}/.ai-tools-assets-tools
      # This repository's own run accepts its AGPL formatters and RPM signer; a caller passes its own pairs.
      LICENSE_EXCEPTIONS: ${{ inputs.license-exceptions || (github.repository == 'dag-node/ai-tools-assets-tools' && 'formatters/**=AGPL-3.0-only packaging/sign-rpms.sh=AGPL-3.0-only' || '') }}
    steps:
      - name: Check out the repository under check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve the tools repository and commit from the workflow file that defines this job
        id: tools
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
          TOOLS_REPOSITORY: ${{ inputs.tools-repository || 'dag-node/ai-tools-assets-tools' }}
        run: |
          if [ -z "$WORKFLOW_REPOSITORY" ] || [ -z "$WORKFLOW_SHA" ] || [ -z "$WORKFLOW_FILE_PATH" ]; then
            echo "job.workflow_repository, job.workflow_sha or job.workflow_file_path is empty (GitHub Enterprise Server does not define them); the tools cannot be checked out at a known commit. Run them from a local pin instead" >&2
            exit 1
          fi
          # GitHub compares a repository name case-insensitively; so does this step.
          if [ "${WORKFLOW_REPOSITORY,,}" != "${TOOLS_REPOSITORY,,}" ]; then
            echo "this workflow file is defined in $WORKFLOW_REPOSITORY, not in $TOOLS_REPOSITORY; a fork of the tools is named in the tools-repository input" >&2
            exit 1
          fi
          if [ "$WORKFLOW_FILE_PATH" != ".github/workflows/validate.yml" ]; then
            echo "this job is defined by $WORKFLOW_FILE_PATH, not .github/workflows/validate.yml; a copy of the workflow is not the tools" >&2
            exit 1
          fi
          echo "repository=$WORKFLOW_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "sha=$WORKFLOW_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the tools at that commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.tools.outputs.repository }}
          ref: ${{ steps.tools.outputs.sha }}
          path: .ai-tools-assets-tools

      # The tools checkout sits inside the workspace, which is the only place actions/checkout places a second
      # repository; git's exclude file keeps it out of the tree under check, which reuse lint and check-licenses read
      # through git's ignore rules.
      - name: Keep the tools checkout out of the tree under check
        run: echo '/.ai-tools-assets-tools/' >> .git/info/exclude

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: The sets follow the format
        if: hashFiles('publisher.conf') != ''
        run: python3 "$TOOLS/tools/validate"

      - name: The committed manifests are what sync-manifests writes
        if: hashFiles('publisher.conf') != ''
        run: python3 "$TOOLS/tools/sync-manifests" --check

      - name: Every file's licence is on the list in force
        run: |
          set -- ; for pair in $LICENSE_EXCEPTIONS; do set -- "$@" --exception "$pair"; done
          python3 "$TOOLS/tools/check-licenses" "$@"

      - name: REUSE lint
        run: |
          python3 -m pip install --quiet --requirement "$TOOLS/.github/requirements-ci.txt"
          reuse lint

      # The ubuntu runner image ships shellcheck; the install runs only where an image stops doing so.
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck

      - name: Every commit of the pull request carries an author-matching Signed-off-by
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ !inputs.enforce-signoff }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "$TOOLS/tools/check-signoff" --range "$BASE_SHA..$HEAD_SHA"

  tests:
    name: tests (python ${{ matrix.python }})
    # github.repository is the caller's in a called job, so this test alone keeps the suite to this repository's runs.
    if: github.repository == 'dag-node/ai-tools-assets-tools'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: The suite, the fixtures and the documented rules
        run: python3 -m unittest discover -s tests -v
