# SPDX-License-Identifier: MIT
# Releases this repository's tooling for a tag v<semver>: verifies the tag's signature against the maintainer's pinned
# key, runs the suite, writes the source archive with its SHA-256 and a detached signature by the org package-signing
# key, builds the RPM ai-tools-assets-tools from that archive, signs it inside an EL9 container and verifies it in EL9
# and EL10, creates the GitHub release with the archive, its .sha256 and .asc and the RPM, and asks dag-node/rpm to
# publish the RPM at rpm.dagnode.com. A prerelease tag (v1.1.0-rc.1) creates a prerelease and does not dispatch.
# A consumer (ai-tools-base's CI, a publisher's tools.pin) pins the tag and verifies the archive against the org key's
# primary, 67F42DC18BF764B42D82F14256D2F802CF9832E4; a host installs the RPM from rpm.dagnode.com.
#
# Each step runs packaging/release-steps.sh, the same steps set-release.yml runs for a publisher's set; that file
# states each step's checks and how the key material is held. The release job alone declares `environment: release`,
# whose deployment policy allows tags v*.*.* and no branch, so the signing key, its passphrase and the dispatch token
# reach a job on a maintainer-created tag and no other ref. The tag is annotated and signed by a maintainer's personal
# key -- p4nda's primary 225DFF22D0221D3DD68CCEFFFABAF500E7D90733, fetched over HTTPS for this one check -- so a leaked
# CI secret cannot mint a release by itself. The tag object verified is the one archived, and the remote's
# `refs/tags/<tag>` is compared with it immediately before the release is created, since `gh release create
# --verify-tag` checks that the name exists, not which object it names: the repository ruleset that makes `v*.*.*`
# tags immutable is the control that holds across the run, and that comparison confirms it is in force. The tag is
# held to v<semver> before anything else runs, as set-release.yml holds a set's tag to <set>/v<semver>.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  TAG_SIGNER_PRIMARY_FINGERPRINTS: 225DFF22D0221D3DD68CCEFFFABAF500E7D90733
  TAG_SIGNER_KEY_URL: https://github.com/p4nda.gpg
  ARTIFACT_SIGNER_PRIMARY_FINGERPRINT: 67F42DC18BF764B42D82F14256D2F802CF9832E4

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: The run is for a tag v<semver>
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$ && "$TAG" != *--* ]] \
            || { echo "::error::$TAG is not v<semver> without build metadata" >&2; exit 1; }
          version="${BASH_REMATCH[1]}"
          dispatch=true
          [[ "$version" == *-* ]] && dispatch=false
          printf 'VERSION=%s\nDISPATCH_RPM=%s\n' "$version" "$dispatch" >> "$GITHUB_ENV"
          echo "version $version, dispatch $dispatch"

      # The write token is not stored in .git/config: git reads this public repository without it, and
      # `gh release create` takes it from GH_TOKEN in its own step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is annotated, names itself, points at this commit, and is signed by the pinned maintainer key
        env:
          EVENT_SHA: ${{ github.sha }}
        run: bash packaging/release-steps.sh verify-tag "$TAG" "$EVENT_SHA"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'

      - name: The suite passes at the verified commit
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT" || { echo "::error::the checkout moved off $RELEASE_COMMIT" >&2; exit 1; }
          python3 -m unittest discover -s tests

      - name: Write the archive of the verified commit and its SHA-256
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/ai-tools-assets-tools-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="ai-tools-assets-tools-$VERSION/" -o "$archive" "$RELEASE_COMMIT"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: The signing key is the pinned artifact signer and the dispatch token reads dag-node/rpm
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          RPM_REPO_DISPATCH_TOKEN: ${{ secrets.RPM_REPO_DISPATCH_TOKEN }}
        run: bash packaging/release-steps.sh preflight

      - name: Sign the archive with the org package-signing key and re-verify
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: bash packaging/release-steps.sh sign-files "$ARCHIVE"

      # The RPM is built from the archive's extracted tree, so it carries the bytes the archive and its signature cover.
      # nFPM takes each mode from that tree and only clears bits, and tar extracts under the shell's umask, so the
      # umask is set here: files 0644 and directories 0755, which an operator reads and traverses on a host.
      - name: Build the unsigned tools RPM from the archive with the pinned nFPM, timestamps from the tag's commit
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$RELEASE_COMMIT")"
          export SOURCE_DATE_EPOCH
          umask 022
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP"
          find "$RUNNER_TEMP/ai-tools-assets-tools-$VERSION" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
          python3 packaging/render-nfpm.py tools --version "$VERSION" --output "$RUNNER_TEMP/nfpm.yaml"
          (cd "$RUNNER_TEMP/ai-tools-assets-tools-$VERSION" \
            && bash "$GITHUB_WORKSPACE/packaging/release-steps.sh" build-rpm "$RUNNER_TEMP/nfpm.yaml" "$GITHUB_WORKSPACE/dist/rpm")
          rpms=(dist/rpm/*.rpm)
          echo "RPM=${rpms[0]}" >> "$GITHUB_ENV"

      - name: Sign the RPM in EL9 and verify its signature in EL9 and EL10
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: bash packaging/release-steps.sh sign-rpm "$RPM"

      - name: Create the release from the verified tag, once the remote still names that tag object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash packaging/release-steps.sh create-release "$TAG" \
            "Tooling release $TAG. Verify the archive with its .asc and the RPM with rpmkeys -K against the dag-node package-signing key, primary $ARTIFACT_SIGNER_PRIMARY_FINGERPRINT." \
            "$ARCHIVE" "$ARCHIVE.sha256" "$ARCHIVE.asc" "$RPM"

      - name: Notify dag-node/rpm to publish the RPM
        if: env.DISPATCH_RPM == 'true'
        env:
          RPM_REPO_DISPATCH_TOKEN: ${{ secrets.RPM_REPO_DISPATCH_TOKEN }}
        run: bash packaging/release-steps.sh dispatch "$TAG"
